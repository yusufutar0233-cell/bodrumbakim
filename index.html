<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f7f7f7;
color:#333;
line-height:1.7;
}

header{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1600&q=80");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
color:#fff;
}

.hero{
max-width:900px;
}

.hero h1{
font-size:58px;
margin-bottom:20px;
}

.hero p{
font-size:24px;
margin-bottom:35px;
}

.btn{
display:inline-block;
background:#0A8F3D;
color:#fff;
padding:18px 38px;
border-radius:10px;
text-decoration:none;
font-size:20px;
font-weight:bold;
transition:.3s;
}

.btn:hover{
background:#087532;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:#fff;
padding:15px 22px;
border-radius:35px;
text-decoration:none;
font-weight:bold;
box-shadow:0 6px 20px rgba(0,0,0,.25);
z-index:999;
}

section{
max-width:1200px;
margin:auto;
padding:80px 20px;
}

h2{
font-size:40px;
text-align:center;
margin-bottom:45px;
color:#0A8F3D;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:25px;
}

.card{
background:#fff;
padding:30px;
border-radius:15px;
box-shadow:0 5px 18px rgba(0,0,0,.12);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.card h3{
margin-bottom:15px;
color:#0A8F3D;
font-size:26px;
}

.card p{
font-size:18px;
}

@media(max-width:768px){

.hero h1{
font-size:38px;
}

.hero p{
font-size:20px;
}

}
